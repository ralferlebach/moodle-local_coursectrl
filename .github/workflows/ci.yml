name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.2"
            moodle-branch: "MOODLE_405_STABLE"
            database: mariadb
          - php: "8.3"
            moodle-branch: "MOODLE_500_STABLE"
            database: mariadb

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: moodle
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Check out plugin code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, mysqli, zip, gd, mbstring, xml, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> $GITHUB_PATH
          echo "$(pwd)/ci/vendor/bin" >> $GITHUB_PATH
        env:
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_ALLOW_SUPERUSER: 1

      - name: Install Moodle
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # ── Static analysis ──────────────────────────────────────────────────
      - name: PHP lint
        if: always()
        run: moodle-plugin-ci phplint

      - name: PHP CodeSniffer (Moodle coding standards)
        if: always()
        run: moodle-plugin-ci phpcs

      - name: PHPDoc check (local_moodlecheck — same as Moodle prechecker)
        if: always()
        run: moodle-plugin-ci phpdoc

      - name: Mustache lint
        if: always()
        run: moodle-plugin-ci mustache

      - name: Grunt (AMD build + ESLint)
        if: always()
        run: moodle-plugin-ci grunt

      - name: Savepoint check
        if: always()
        run: moodle-plugin-ci savepoint

      - name: Third-party library check
        if: always()
        run: moodle-plugin-ci thirdpartylibs

      # ── Tests ────────────────────────────────────────────────────────────
      - name: PHPUnit
        if: always()
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat (headless Chrome)
        if: always()
        run: moodle-plugin-ci behat --profile chrome
        env:
          MOODLE_START_BEHAT_RUNNER: true

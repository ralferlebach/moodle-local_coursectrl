##############################################################################
# GitHub Actions CI – local_coursectrl (Course Control Hub)
#
# Matrix:
#   Moodle:  4.5, 5.0, 5.1
#   PHP:     8.2, 8.3, 8.4  (8.4 excluded for Moodle < 5.1)
#   DB:      MariaDB 10.11  |  PostgreSQL 16
#
# Third-party plugins (not in Moodle core, required by coursectrl adapters):
#   mod_questionnaire  github.com/PoetOS/moodle-mod_questionnaire
#   mod_choicegroup    github.com/ndunand/moodle-mod_choicegroup
#   mod_studentquiz    github.com/studentquiz/moodle-mod_studentquiz
#   mod_capquiz        github.com/KQMATH/moodle-mod_capquiz
#
# Strategy: clone Moodle and third-party plugins BEFORE moodle-plugin-ci install
# so that phpunit/behat init discover all plugins in a single pass.
##############################################################################

name: Moodle Plugin CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  MOODLE_CI: '^4'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── 1a. PHP Lint ──────────────────────────────────────────────────────────
  lint-php:
    name: "PHP Lint – ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: PHP CodeSniffer (Moodle coding style)
        run: moodle-plugin-ci phpcs plugin

      - name: PHP Mess Detector
        run: moodle-plugin-ci phpmd plugin || true

  # ── 1b. JS / CSS Lint ────────────────────────────────────────────────────
  lint-js:
    name: "JS/CSS Lint"
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install en_AU.UTF-8 locale
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH_NAME:-main}" >> "$GITHUB_ENV"

      - name: Clone Moodle and third-party plugins
        run: |
          git clone --depth=1 --branch MOODLE_405_STABLE \
            https://github.com/moodle/moodle.git \
            "${{ github.workspace }}/moodle"
          MOODLE_DIR="${{ github.workspace }}/moodle"
          clone_p() { git clone --depth=1 "$1" "$2" 2>/dev/null && echo "OK: $2" || echo "SKIP: $2"; }
          clone_p https://github.com/PoetOS/moodle-mod_questionnaire  "$MOODLE_DIR/mod/questionnaire"
          clone_p https://github.com/ndunand/moodle-mod_choicegroup    "$MOODLE_DIR/mod/choicegroup"
          clone_p https://github.com/studentquiz/moodle-mod_studentquiz "$MOODLE_DIR/mod/studentquiz"
          clone_p https://github.com/KQMATH/moodle-mod_capquiz          "$MOODLE_DIR/mod/capquiz"

      - name: Install Moodle (grunt baseline)
        run: |
          moodle-plugin-ci install \
            --plugin  ./plugin \
            --moodle  "${{ github.workspace }}/moodle" \
            --branch  MOODLE_405_STABLE \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle \
            --no-init

      - name: Install Node dependencies
        run: npm install
        working-directory: ${{ github.workspace }}/moodle

      - name: ESLint – AMD JS
        run: moodle-plugin-ci grunt -m "$GITHUB_WORKSPACE/moodle" -t eslint

      - name: Stylelint – CSS
        run: moodle-plugin-ci grunt -m "$GITHUB_WORKSPACE/moodle" -t stylelint
        continue-on-error: true

      - name: Verify AMD build artefacts
        run: |
          if ! ls plugin/amd/src/*.js 2>/dev/null | grep -q .; then
            echo "No AMD source files — skipping."; exit 0
          fi
          MISSING=0
          for src in plugin/amd/src/*.js; do
            base=$(basename "$src" .js)
            [ -f "plugin/amd/build/${base}.min.js" ] || { echo "MISSING: $base.min.js"; MISSING=$((MISSING+1)); }
          done
          [ "$MISSING" -eq 0 ] && echo "AMD OK." || { echo "ERROR: $MISSING file(s) missing."; exit 1; }

  # ── 2. PHPUnit ────────────────────────────────────────────────────────────
  phpunit:
    name: "PHPUnit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]
    strategy:
      fail-fast: false
      matrix:
        moodle:
          - MOODLE_405_STABLE
          - MOODLE_500_STABLE
          - MOODLE_501_STABLE
        php: ['8.2', '8.3', '8.4']
        db:
          - { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   }
          - { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle }
        exclude:
          - { moodle: MOODLE_405_STABLE, php: '8.4' }
          - { moodle: MOODLE_500_STABLE, php: '8.4' }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH_NAME:-main}" >> "$GITHUB_ENV"

      - name: Clone Moodle and third-party plugins
        run: |
          git clone --depth=1 --branch ${{ matrix.moodle }} \
            https://github.com/moodle/moodle.git \
            "${{ github.workspace }}/moodle"
          MOODLE_DIR="${{ github.workspace }}/moodle"
          clone_p() { git clone --depth=1 "$1" "$2" 2>/dev/null && echo "OK: $2" || echo "SKIP: $2"; }
          clone_p https://github.com/PoetOS/moodle-mod_questionnaire   "$MOODLE_DIR/mod/questionnaire"
          clone_p https://github.com/ndunand/moodle-mod_choicegroup     "$MOODLE_DIR/mod/choicegroup"
          clone_p https://github.com/studentquiz/moodle-mod_studentquiz "$MOODLE_DIR/mod/studentquiz"
          clone_p https://github.com/KQMATH/moodle-mod_capquiz           "$MOODLE_DIR/mod/capquiz"

      - name: Install Moodle ${{ matrix.moodle }}
        run: |
          moodle-plugin-ci install \
            --plugin  ./plugin \
            --moodle  "${{ github.workspace }}/moodle" \
            --branch  ${{ matrix.moodle }} \
            --db-type ${{ matrix.db.type }} \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle

      - name: PHPUnit – all tests
        run: moodle-plugin-ci phpunit

  # ── 3. Behat ─────────────────────────────────────────────────────────────
  behat:
    name: "Behat (${{ matrix.moodle }} / PHP 8.2 / Chrome)"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]
    strategy:
      fail-fast: false
      matrix:
        moodle:
          - MOODLE_405_STABLE
          - MOODLE_500_STABLE
          - MOODLE_501_STABLE

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH_NAME:-main}" >> "$GITHUB_ENV"

      - name: Clone Moodle and third-party plugins
        run: |
          git clone --depth=1 --branch ${{ matrix.moodle }} \
            https://github.com/moodle/moodle.git \
            "${{ github.workspace }}/moodle"
          MOODLE_DIR="${{ github.workspace }}/moodle"
          clone_p() { git clone --depth=1 "$1" "$2" 2>/dev/null && echo "OK: $2" || echo "SKIP: $2"; }
          clone_p https://github.com/PoetOS/moodle-mod_questionnaire   "$MOODLE_DIR/mod/questionnaire"
          clone_p https://github.com/ndunand/moodle-mod_choicegroup     "$MOODLE_DIR/mod/choicegroup"
          clone_p https://github.com/studentquiz/moodle-mod_studentquiz "$MOODLE_DIR/mod/studentquiz"
          clone_p https://github.com/KQMATH/moodle-mod_capquiz           "$MOODLE_DIR/mod/capquiz"

      - name: Install Moodle ${{ matrix.moodle }}
        run: |
          moodle-plugin-ci install \
            --plugin  ./plugin \
            --moodle  "${{ github.workspace }}/moodle" \
            --branch  ${{ matrix.moodle }} \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle

      - name: Behat – all plugin scenarios
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@local_coursectrl and not @broken" \
            --start-servers

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-${{ matrix.moodle }}
          path: ${{ github.workspace }}/moodle/behatfaildumps/
          retention-days: 7
